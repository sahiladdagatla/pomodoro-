<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusQuest - Gamified Pomodoro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-elevated: #1a1a25;
            --primary: #6366f1;
            --primary-glow: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --accent-purple: #a855f7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2e2e3a;
            --xp-gold: #fbbf24;
            --streak-flame: #ff6b35;
        }
        
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }
        
        .progress-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .progress-bg-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, 
                rgba(99, 102, 241, 0.15) 0%, 
                rgba(168, 85, 247, 0.25) 50%, 
                rgba(236, 72, 153, 0.35) 100%);
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .progress-bg-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent-pink) 50%, var(--xp-gold) 100%);
            box-shadow: 0 0 30px var(--primary);
        }
        
        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            animation: float-up 4s infinite;
        }
        
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-20px) scale(1); opacity: 0; }
        }
        
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .level-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid var(--primary);
            border-radius: 20px;
        }
        
        .level-number {
            font-weight: 700;
            color: var(--xp-gold);
        }
        
        .streak-display {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 107, 53, 0.2);
            border: 1px solid var(--streak-flame);
            border-radius: 20px;
            font-weight: 600;
        }
        
        .timer-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .timer-display {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 30px;
        }
        
        .timer-ring {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        
        .timer-ring-bg {
            fill: none;
            stroke: var(--bg-elevated);
            stroke-width: 10;
        }
        
        .timer-ring-progress {
            fill: none;
            stroke: url(#timerGradient);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }
        
        .timer-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .timer-time {
            font-size: 3.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }
        
        .timer-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
        }
        
        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        .session-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .session-badge {
            padding: 8px 16px;
            background: rgba(26, 26, 37, 0.8);
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
        }
        
        .xp-badge {
            border: 1px solid var(--xp-gold);
            color: var(--xp-gold);
        }
        
        .quest-display {
            background: rgba(26, 26, 37, 0.8);
            border: 1px solid var(--accent-pink);
            border-radius: 12px;
            padding: 12px 20px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }
        
        .quest-title {
            font-size: 0.8rem;
            color: var(--accent-pink);
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .quest-progress {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .social-section {
            margin-top: 20px;
            padding: 15px;
            background: rgba(26, 26, 37, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .social-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .social-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .share-btn {
            padding: 6px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        
        .share-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        .focus-buddies {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 100px;
            overflow-y: auto;
        }
        
        .buddy-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: var(--bg-elevated);
            border-radius: 8px;
            font-size: 0.85rem;
        }
        
        .buddy-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
        
        .buddy-name {
            flex: 1;
        }
        
        .buddy-status {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        .status-dot.active { background: var(--success); }
        .status-dot.break { background: var(--warning); }
        .status-dot.idle { background: var(--text-muted); }
        
        .buddy-timer {
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary-glow);
        }
        
        .break-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .break-screen.active {
            display: flex;
        }
        
        .break-content {
            text-align: center;
            padding: 30px;
        }
        
        .break-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 15px;
        }
        
        .break-quote {
            font-size: 1rem;
            color: var(--text-secondary);
            max-width: 400px;
            margin: 15px auto;
            font-style: italic;
        }
        
        .break-timer {
            font-size: 4rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary-glow);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }
        
        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .modal-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 15px;
        }
        
        .modal-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .level-up-animation {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .level-up-animation.active {
            display: flex;
        }
        
        .level-up-text {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--xp-gold) 0%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: bounce 0.6s ease infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .level-up-number {
            font-size: 6rem;
            font-weight: 800;
            color: var(--accent-purple);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            z-index: 4000;
            transform: translateX(150%);
            transition: transform 0.3s ease;
        }
        
        .notification.active {
            transform: translateX(0);
        }
        
        .achievement-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            background: var(--bg-card);
            border: 2px solid var(--xp-gold);
            border-radius: 14px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 5000;
            transition: transform 0.5s ease;
        }
        
        .achievement-toast.active {
            transform: translateX(-50%) translateY(0);
        }
        
        .achievement-toast-icon {
            font-size: 2rem;
        }
        
        .achievement-toast-content {
            text-align: left;
        }
        
        .achievement-toast-title {
            font-weight: 700;
            color: var(--xp-gold);
            font-size: 0.9rem;
        }
        
        .achievement-toast-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .no-buddies {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            padding: 10px;
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#ec4899" />
            </linearGradient>
        </defs>
    </svg>

    <div class="progress-bg">
        <div class="progress-bg-fill" id="bgProgress"></div>
        <div class="floating-particles" id="particles"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="logo">🎯 FocusQuest</div>
            <div style="display: flex; gap: 10px;">
                <div class="level-display">
                    <span>Lvl</span>
                    <span class="level-number" id="levelDisplay">1</span>
                </div>
                <div class="streak-display">
                    <span>🔥</span>
                    <span id="streakNum">0</span>
                </div>
            </div>
        </header>

        <div class="timer-section">
            <div class="timer-display">
                <svg class="timer-ring" viewBox="0 0 220 220">
                    <circle class="timer-ring-bg" cx="110" cy="110" r="95"/>
                    <circle class="timer-ring-progress" cx="110" cy="110" r="95" 
                        stroke-dasharray="597" stroke-dashoffset="597" id="timerRing"/>
                </svg>
                <div class="timer-inner">
                    <div class="timer-time" id="timerDisplay">25:00</div>
                    <div class="timer-label" id="timerLabel">Focus</div>
                </div>
            </div>
            
            <div class="timer-controls">
                <button class="btn btn-primary" id="startBtn">▶ Start</button>
                <button class="btn btn-secondary" id="pauseBtn" style="display: none;">⏸ Pause</button>
                <button class="btn btn-secondary" id="resetBtn">↻</button>
            </div>

            <div class="session-info">
                <div class="session-badge xp-badge">
                    <span>+<span id="xpGain">50</span> XP</span>
                </div>
                <div class="session-badge" style="border: 1px solid var(--border);">
                    <span>🎯 <span id="todayCount">0</span> today</span>
                </div>
            </div>

            <div class="quest-display">
                <div class="quest-title">🎯 Daily Quest</div>
                <div class="quest-progress" id="questProgress">0/3 - Complete 3 Pomodoros</div>
            </div>

            <div class="social-section">
                <div class="social-header">
                    <span class="social-title">👥 Buddies (<span id="buddyCount">0</span>)</span>
                    <button class="share-btn" id="shareBtn">Share</button>
                </div>
                <div class="focus-buddies" id="focusBuddies">
                    <div class="no-buddies">Share link to invite friends!</div>
                </div>
            </div>
        </div>
    </div>

    <div class="break-screen" id="breakScreen">
        <div class="break-content">
            <div class="break-title">🎉 Great Work!</div>
            <div class="break-quote" id="breakQuote">"The secret of getting ahead is getting started."</div>
            <div class="break-timer" id="breakTimerDisplay">05:00</div>
            <button class="btn btn-primary" id="skipBreakBtn" style="margin-top: 20px;">Skip →</button>
        </div>
    </div>

    <div class="level-up-animation" id="levelUpScreen">
        <div class="level-up-text">LEVEL UP!</div>
        <div class="level-up-number" id="levelUpNumber">2</div>
    </div>

    <div class="modal" id="shareModal">
        <div class="modal-content">
            <div class="modal-title">🔗 Share Room</div>
            <input type="text" class="modal-input" id="shareLink" readonly>
            <button class="btn btn-primary" id="copyLinkBtn">Copy</button>
            <button class="btn btn-secondary" id="closeShareModal" style="margin-top: 10px;">Close</button>
        </div>
    </div>

    <div class="modal" id="nameModal">
        <div class="modal-content">
            <div class="modal-title">👋 Welcome!</div>
            <input type="text" class="modal-input" id="nameInput" placeholder="Your name..." maxlength="15">
            <button class="btn btn-primary" id="saveNameBtn">Let's Go</button>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <div class="achievement-toast" id="achievementToast">
        <div class="achievement-toast-icon" id="achievementToastIcon">🏆</div>
        <div class="achievement-toast-content">
            <div class="achievement-toast-title">Achievement!</div>
            <div class="achievement-toast-desc" id="achievementToastDesc">Name</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDemo-Pomodoro-App",
            authDomain: "focusquest-demo.firebaseapp.com",
            databaseURL: "https://focusquest-demo-default-rtdb.firebaseio.com",
            projectId: "focusquest-demo",
            storageBucket: "focusquest-demo.appspot.com",
            messagingSenderId: "000000000000",
            appId: "1:000000000000:web:0000000000000000000000"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const motivationalQuotes = [
            "The secret of getting ahead is getting started. - Mark Twain",
            "Focus on being productive instead of busy. - Tim Ferriss",
            "Success is the sum of small efforts repeated day in and day out. - Robert Collier",
            "Don't watch the clock; do what it does. Keep going. - Sam Levenson",
            "It does not matter how slowly you go as long as you do not stop. - Confucius",
            "Believe you can and you're halfway there. - Theodore Roosevelt"
        ];

        const achievements = [
            { id: 'sprout', name: 'Sprout', desc: 'First Pomodoro', req: 1, type: 'sessions', icon: '🌱', xp: 0 },
            { id: 'ignited', name: 'Ignited', desc: '3-day streak', req: 3, type: 'streak', icon: '🔥', xp: 100 },
            { id: 'energized', name: 'Energized', desc: '7-day streak', req: 7, type: 'streak', icon: '⚡', xp: 300 },
            { id: 'momentum', name: 'Momentum', desc: '14-day streak', req: 14, type: 'streak', icon: '🚀', xp: 750 },
            { id: 'master', name: 'Master', desc: '30-day streak', req: 30, type: 'streak', icon: '👑', xp: 2000 },
            { id: 'bookworm', name: 'Bookworm', desc: '10 hours total', req: 10, type: 'hours', icon: '📚', xp: 200 },
            { id: 'scholar', name: 'Scholar', desc: '50 hours total', req: 50, type: 'hours', icon: '🧠', xp: 500 },
            { id: 'champion', name: 'Champion', desc: '100 hours total', req: 100, type: 'hours', icon: '🏆', xp: 1000 },
            { id: 'marathon', name: 'Marathon', desc: '4 in one day', req: 4, type: 'daily_sessions', icon: '💪', xp: 100 },
            { id: 'gambler', name: 'Gambler', desc: '100 total sessions', req: 100, type: 'sessions', icon: '🎲', xp: 500 },
            { id: 'diamond', name: 'Diamond', desc: 'Reach Level 10', req: 10, type: 'level', icon: '💎', xp: 300 },
            { id: 'unlocker', name: 'Unlocker', desc: '10 achievements', req: 10, type: 'achievements', icon: '🔓', xp: 200 }
        ];

        const dailyChallenges = [
            { desc: 'Complete 3 Pomodoros today', target: 3, xp: 75 },
            { desc: 'Study for 2 hours today', target: 120, xp: 100, type: 'time' },
            { desc: 'Complete 5 Pomodoros today', target: 5, xp: 150 },
            { desc: 'Earn 200 XP today', target: 200, xp: 100, type: 'xp' }
        ];

        let userData = {
            name: 'Focuser',
            xp: 0,
            level: 1,
            totalSessions: 0,
            totalTime: 0,
            streak: 0,
            lastSessionDate: null,
            todaySessions: 0,
            todayTime: 0,
            achievements: [],
            purchased: [],
            sessionsHistory: [],
            dailyChallenge: null,
            dailyChallengeProgress: 0
        };

        let timerState = {
            isRunning: false,
            isPaused: false,
            isBreak: false,
            currentTime: 25 * 60,
            totalTime: 25 * 60,
            sessionsCompleted: 0
        };

        let roomCode = null;
        let roomRef = null;
        let userId = 'user_' + Math.random().toString(36).substr(2, 9);
        let buddies = {};

        function init() {
            loadData();
            checkName();
            setupEventListeners();
            updateUI();
            generateDailyChallenge();
            setupRoomFromURL();
            createParticles();
            startSync();
        }

        function loadData() {
            const saved = localStorage.getItem('focusquest_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                userData = { ...userData, ...parsed };
                checkNewDay();
            }
        }

        function saveData() {
            localStorage.setItem('focusquest_data', JSON.stringify(userData));
        }

        function checkNewDay() {
            const today = new Date().toDateString();
            if (userData.lastSessionDate !== today) {
                if (userData.lastSessionDate) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    if (userData.lastSessionDate !== yesterday.toDateString()) {
                        userData.streak = 0;
                    }
                }
                userData.todaySessions = 0;
                userData.todayTime = 0;
                userData.dailyChallengeProgress = 0;
                userData.lastSessionDate = today;
                generateDailyChallenge();
            }
        }

        function checkName() {
            if (!userData.name || userData.name === 'Focuser') {
                document.getElementById('nameModal').classList.add('active');
            }
        }

        function setupEventListeners() {
            document.getElementById('startBtn').addEventListener('click', startTimer);
            document.getElementById('pauseBtn').addEventListener('click', pauseTimer);
            document.getElementById('resetBtn').addEventListener('click', resetTimer);
            document.getElementById('skipBreakBtn').addEventListener('click', skipBreak);
            document.getElementById('shareBtn').addEventListener('click', showShareModal);
            document.getElementById('copyLinkBtn').addEventListener('click', copyShareLink);
            document.getElementById('closeShareModal').addEventListener('click', () => document.getElementById('shareModal').classList.remove('active'));
            document.getElementById('saveNameBtn').addEventListener('click', saveName);
            document.getElementById('nameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') saveName(); });
        }

        function startTimer() {
            if (timerState.isPaused) {
                timerState.isPaused = false;
                timerState.isRunning = true;
            } else {
                timerState.isRunning = true;
                timerState.isBreak = false;
            }
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'flex';
            document.getElementById('timerLabel').textContent = timerState.isBreak ? 'Break' : 'Focus';
            updateRoomStatus('focusing');
            tick();
        }

        function pauseTimer() {
            timerState.isRunning = false;
            timerState.isPaused = true;
            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('startBtn').textContent = '▶ Resume';
            updateRoomStatus('paused');
        }

        function resetTimer() {
            timerState.isRunning = false;
            timerState.isPaused = false;
            timerState.isBreak = false;
            timerState.currentTime = 25 * 60;
            timerState.totalTime = timerState.currentTime;
            updateTimerDisplay();
            document.getElementById('startBtn').style.display = 'flex';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('startBtn').textContent = '▶ Start';
            document.getElementById('timerLabel').textContent = 'Focus';
            updateTimerRing();
            updateRoomStatus('idle');
        }

        function tick() {
            if (!timerState.isRunning) return;
            timerState.currentTime--;
            updateTimerDisplay();
            updateTimerRing();
            if (timerState.currentTime <= 0) {
                if (timerState.isBreak) {
                    endBreak();
                } else {
                    completeSession(true);
                }
            } else {
                requestAnimationFrame(() => setTimeout(tick, 1000));
            }
        }

        function completeSession(completedFully) {
            const xpEarned = calculateXP(completedFully);
            userData.xp += xpEarned;
            userData.totalSessions++;
            userData.todaySessions++;
            userData.todayTime += 25;
            timerState.sessionsCompleted++;
            userData.sessionsHistory.push({
                date: new Date().toISOString(),
                duration: 25,
                xp: xpEarned
            });

            const oldLevel = userData.level;
            updateLevel();
            checkLevelUp(oldLevel);

            userData.streak++;
            userData.dailyChallengeProgress++;
            checkDailyChallenge();
            checkAchievements();
            saveData();
            updateUI();

            if (completedFully) {
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                
                const breakTime = timerState.sessionsCompleted % 4 === 0 ? 15 : 5;
                timerState.currentTime = breakTime * 60;
                timerState.totalTime = timerState.currentTime;
                timerState.isBreak = true;
                showBreakScreen(breakTime);
            } else {
                resetTimer();
            }
        }

        function calculateXP(completedFully) {
            let xp = 50;
            xp += Math.min(userData.streak * 10, 50);
            return xp;
        }

        function updateLevel() {
            const newLevel = Math.floor(Math.sqrt(userData.xp / 100)) + 1;
            if (newLevel > userData.level) {
                userData.level = newLevel;
            }
        }

        function checkLevelUp(oldLevel) {
            if (userData.level > oldLevel) {
                document.getElementById('levelUpNumber').textContent = userData.level;
                document.getElementById('levelUpScreen').classList.add('active');
                setTimeout(() => {
                    document.getElementById('levelUpScreen').classList.remove('active');
                }, 2500);
            }
        }

        function showBreakScreen(minutes) {
            const quote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
            document.getElementById('breakQuote').textContent = quote;
            document.getElementById('breakScreen').classList.add('active');
            
            let breakTime = minutes * 60;
            const breakTick = () => {
                breakTime--;
                const mins = Math.floor(breakTime / 60);
                const secs = breakTime % 60;
                document.getElementById('breakTimerDisplay').textContent = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (breakTime > 0) setTimeout(breakTick, 1000);
            };
            breakTick();
            updateRoomStatus('break');
        }

        function skipBreak() {
            document.getElementById('breakScreen').classList.remove('active');
            resetTimer();
        }

        function endBreak() {
            document.getElementById('breakScreen').classList.remove('active');
            resetTimer();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerState.currentTime / 60);
            const secs = timerState.currentTime % 60;
            document.getElementById('timerDisplay').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerRing() {
            const progress = 1 - (timerState.currentTime / timerState.totalTime);
            const circumference = 2 * Math.PI * 95;
            const offset = circumference * (1 - progress);
            document.getElementById('timerRing').style.strokeDashoffset = offset;
        }

        function updateUI() {
            document.getElementById('levelDisplay').textContent = userData.level;
            document.getElementById('streakNum').textContent = userData.streak;
            document.getElementById('xpGain').textContent = 50 + Math.min(userData.streak * 10, 50);
            document.getElementById('todayCount').textContent = userData.todaySessions;

            const nextLevelXP = (userData.level + 1) * (userData.level + 1) * 100;
            const xpInLevel = userData.xp - ((userData.level - 1) * (userData.level - 1) * 100);
            const xpNeeded = nextLevelXP - ((userData.level - 1) * (userData.level - 1) * 100);
            const xpPercent = (xpInLevel / xpNeeded) * 100;
            document.getElementById('bgProgress').style.height = `${Math.min(xpPercent, 100)}%`;

            if (userData.dailyChallenge) {
                document.getElementById('questProgress').textContent = 
                    `${Math.min(userData.dailyChallengeProgress, userData.dailyChallenge.target)}/${userData.dailyChallenge.target} - ${userData.dailyChallenge.desc}`;
            }
        }

        function generateDailyChallenge() {
            if (!userData.dailyChallenge) {
                userData.dailyChallenge = dailyChallenges[Math.floor(Math.random() * dailyChallenges.length)];
            }
        }

        function checkDailyChallenge() {
            const challenge = userData.dailyChallenge;
            if (!challenge) return;
            
            let progress = 0;
            if (challenge.type === 'time') progress = userData.todayTime;
            else if (challenge.type === 'xp') progress = userData.xp;
            else progress = userData.todaySessions;
            
            userData.dailyChallengeProgress = progress;
            
            if (progress >= challenge.target) {
                userData.xp += challenge.xp;
                showNotification(`Quest complete! +${challenge.xp} XP`);
                updateLevel();
                saveData();
            }
        }

        function checkAchievements() {
            achievements.forEach(achievement => {
                if (userData.achievements.includes(achievement.id)) return;
                
                let earned = false;
                if (achievement.type === 'sessions' && userData.totalSessions >= achievement.req) earned = true;
                if (achievement.type === 'streak' && userData.streak >= achievement.req) earned = true;
                if (achievement.type === 'hours' && userData.totalTime / 60 >= achievement.req) earned = true;
                if (achievement.type === 'daily_sessions' && userData.todaySessions >= achievement.req) earned = true;
                if (achievement.type === 'level' && userData.level >= achievement.req) earned = true;
                if (achievement.type === 'achievements' && userData.achievements.length >= achievement.req) earned = true;
                
                if (earned) {
                    userData.achievements.push(achievement.id);
                    userData.xp += achievement.xp;
                    showAchievementToast(achievement);
                }
            });
            saveData();
        }

        function showAchievementToast(achievement) {
            document.getElementById('achievementToastIcon').textContent = achievement.icon;
            document.getElementById('achievementToastDesc').textContent = achievement.name;
            document.getElementById('achievementToast').classList.add('active');
            setTimeout(() => {
                document.getElementById('achievementToast').classList.remove('active');
            }, 3500);
        }

        function showNotification(message) {
            document.getElementById('notification').textContent = message;
            document.getElementById('notification').classList.add('active');
            setTimeout(() => {
                document.getElementById('notification').classList.remove('active');
            }, 2500);
        }

        function showShareModal() {
            if (!roomCode) {
                roomCode = Math.random().toString(36).substr(2, 6).toUpperCase();
            }
            const shareURL = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            document.getElementById('shareLink').value = shareURL;
            document.getElementById('shareModal').classList.add('active');
            joinRoom(roomCode);
        }

        function copyShareLink() {
            const input = document.getElementById('shareLink');
            input.select();
            document.execCommand('copy');
            showNotification('Link copied!');
        }

        function setupRoomFromURL() {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            if (room) {
                roomCode = room.toUpperCase();
                joinRoom(roomCode);
            }
        }

        function joinRoom(code) {
            roomRef = db.ref(`rooms/${code}`);
            
            roomRef.child('users').child(userId).set({
                name: userData.name,
                status: 'idle',
                timer: 0,
                joinedAt: firebase.database.ServerValue.TIMESTAMP
            });

            roomRef.child('users').on('value', (snapshot) => {
                const users = snapshot.val() || {};
                delete users[userId];
                buddies = users;
                updateBuddiesUI();
            });

            roomRef.on('disconnect', () => {
                roomRef.child('users').child(userId).remove();
            });
        }

        function updateRoomStatus(status) {
            if (!roomRef) return;
            const timeLeft = Math.floor(timerState.currentTime / 60);
            roomRef.child('users').child(userId).update({
                status: status,
                timer: timeLeft
            });
        }

        function updateBuddiesUI() {
            const container = document.getElementById('focusBuddies');
            const count = Object.keys(buddies).length;
            document.getElementById('buddyCount').textContent = count;
            
            if (count === 0) {
                container.innerHTML = '<div class="no-buddies">Share link to invite friends!</div>';
                return;
            }
            
            container.innerHTML = Object.entries(buddies).map(([id, data]) => {
                const statusClass = data.status === 'focusing' ? 'active' : data.status === 'break' ? 'break' : 'idle';
                const statusText = data.status === 'focusing' ? 'Focusing' : data.status === 'break' ? 'Break' : 'Idle';
                return `
                    <div class="buddy-card">
                        <div class="buddy-avatar">${data.name.charAt(0).toUpperCase()}</div>
                        <div class="buddy-name">${data.name}</div>
                        <div class="buddy-status">
                            <span class="status-dot ${statusClass}"></span>
                            ${statusText}
                        </div>
                        <div class="buddy-timer">${data.timer > 0 ? data.timer + 'm' : '--'}</div>
                    </div>
                `;
            }).join('');
        }

        function startSync() {
            setInterval(() => {
                if (timerState.isRunning) {
                    updateRoomStatus(timerState.isBreak ? 'break' : 'focusing');
                }
            }, 30000);
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.animationDuration = (3 + Math.random() * 2) + 's';
                container.appendChild(particle);
            }
        }

        function saveName() {
            const name = document.getElementById('nameInput').value.trim();
            if (name) {
                userData.name = name;
                saveData();
            }
            document.getElementById('nameModal').classList.remove('active');
            updateUI();
        }

        init();
    </script>
</body>
</html>
